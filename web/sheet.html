<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="리뷰시트"><script src="/push.js" defer></script>
<title>답변 시트</title>
<link rel="stylesheet" href="/sheet.css">
<script src="/mic.js" defer></script>
<script src="/compose.js" defer></script>
</head>
<body class="rs-page">
<main id="app"></main>
<script>
/* review-sheet page. ?d=<name> loads /<name>-data.js (served from the sheet dir), which sets window.SHEET.
   Answers POST to /__answers?sheet=<SHEET.id> (bin/review-sheet.mjs writes <dir>/answers/<id>.json)
   and are kept in localStorage as a per-device draft.

   SHEET = { id, title, eyebrow?, lede? (html), howto? (html), issueUrl? ('https://github.com/o/r/issues/'),
             sections: [ { id, code, title, issue?, first?, ask?, askLabel?, now?, nowLabel?,
                           links?: [[label, url]], images?: [[src, caption]], html?, table?: { head, rows, note? }, flow?: [..],
                           questions: [ { k, q, sit?, decide?, effect?, images?: [[src, caption]], links?: [[label, url]], opts: [[label, example?, img?], …], rec?, why? } | [k, q, opts, rec, why] ] } ] }
                           (images/links on a QUESTION render right under that question — hero 2026-10-02: one picture per question, not a pile on top)
   The reviewer must understand each question without the issue open: plain language, one example per option. */
(function(){
  const d = (new URLSearchParams(location.search).get('d') || '').replace(/[^a-z0-9-]/g, '');
  if(!d){ document.getElementById('app').innerHTML = '<p>?d=&lt;name&gt; 가 필요하다 — <a href="/">목록</a></p>'; return; }
  const tag = document.createElement('script');
  tag.src = '/' + d + '-data.js';
  tag.onload = () => window.SHEET ? window.SHEET_RUN() : (document.getElementById('app').textContent = d + '-data.js 가 window.SHEET 를 만들지 않는다');
  tag.onerror = () => { document.getElementById('app').innerHTML = d + '-data.js 가 없다 — <a href="/">목록</a>'; };
  document.head.appendChild(tag);
}());
window.SHEET_RUN = function(){
'use strict';
const D = window.SHEET;
const SHEET_NAME = (new URLSearchParams(location.search).get('d') || '').replace(/[^a-z0-9-]/g, '');
const MIC = '<button type="button" class="rs-mic" data-idle="🎤 음성" aria-label="음성 입력">🎤 음성</button>';   // web/mic.js: 탭=녹음, 다시 탭=전사 → 옆 메모칸 커서에 삽입
const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* Text fields (ask/now/sit/decide/effect/why/question/table) are escaped, then a small markup set comes back:
   <b> <i> <u> <s> <code> <strong> <em> <br> and "\n". Sessions kept writing "<b>문제</b>…<br>" into `now` and hero
   saw the raw tags (2026-10-05) — tolerate that set instead of tag soup; anything else stays visible text. */
/* <a href="https://…">text</a> also comes back (http/https only, opens in a new tab) — evidence links in `now` were dead text (2026-10-12). */
const m = s => e(s).replace(/&lt;(\/?)(b|i|u|s|code|strong|em)&gt;/g, '<$1$2>').replace(/&lt;br\s*\/?&gt;/g, '<br>')
  .replace(/&lt;a href=&quot;(https?:\/\/[^\s"<>]+?)&quot;&gt;([\s\S]*?)&lt;\/a&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>').replace(/\n/g, '<br>');
const issueHref = v => /^https?:/.test(String(v)) ? String(v) : (D.issueUrl || '') + v;
const issueText = v => /^https?:/.test(String(v)) ? '이슈' : '#' + v;
const tbl = t => '<div class="g-wrap"><table class="g-t"><tr>' + t.head.map(x => '<th>' + e(x) + '</th>').join('') + '</tr>' +
  t.rows.map(r => '<tr>' + r.map((v, i) => '<td' + (i === 0 ? ' class="def"' : '') + '>' + m(v) + '</td>').join('') + '</tr>').join('') + '</table></div>' +
  (t.note ? '<p class="v-exnote">' + m(t.note) + '</p>' : '');
const norm = qq => Array.isArray(qq) ? { k: qq[0], q: qq[1], opts: qq[2].map(x => Array.isArray(x) ? x : [x]), rec: qq[3] || '', why: qq[4] || '' }
                                     : Object.assign({}, qq, { opts: (qq.opts || []).map(x => Array.isArray(x) ? x : [x]), rec: qq.rec || '', why: qq.why || '' });

/* 보고 시트 (hero 2026-10-15) — D.report 또는 '✅ 머지했습니다 — …' 같은 제목 → 아이콘+한 단어 배지, 아래 줄 ✓ 확인 체크(세션 안 깨움).
   bin/review-sheet.mjs reportOf 와 같은 규칙. */
const REPORTS = { merged: '🔀 머지됨', deployed: '🚀 배포됨', done: '✅ 끝남', note: '📌 보고' }, RALIAS = { 머지: 'merged', 배포: 'deployed', 끝: 'done', 보고: 'note' };
const REP = (() => {
  const t = String(D.title || D.id);
  let k = D.report ? (REPORTS[D.report] ? D.report : RALIAS[D.report] || 'note') : '', title = t;
  const plan = /해\s*놓겠습니다/.test(t + String(D.lede || '')), ok = plan ? /확인|그대로|진행|머지|이대로|실행|적용/ : /확인|그대로/;
  const decides = (!plan && /승인 요청/.test(t + String(D.lede || ''))) || (D.sections || []).some(s => (s.questions || []).some(q => { const o = Array.isArray(q) ? q[2] : q.opts; const f = o && o[0]; const l = Array.isArray(f) ? f[0] : f; return l && !ok.test(String(l)); }));
  if (!k && decides) return null;
  for (const [re, kk] of [[/^\s*(?:(?:✅|🔀|📌)\s*)?머지(?:했습니다|되었습니다|됨|완료)\s*[—:·-]?\s*/, 'merged'], [/^\s*(?:(?:✅|🚀|📌)\s*)?배포(?:했습니다|되었습니다|됨|완료)\s*[—:·-]?\s*/, 'deployed'], [/^\s*(?:📌\s*)?(?:이렇게\s*)?해\s*놓겠습니다\s*[—:·-]?\s*/, 'note']])
    if (re.test(t)) { title = t.replace(re, '') || t; k = k || kk; break; }
  if (!k && plan) k = 'note';   // '이렇게 해놓겠습니다' = 보고(hero 2026-10-15)
  return k ? { label: REPORTS[k], title } : null;
})();
if (REP) document.body.classList.add('rs-report');
document.title = REP ? REP.label + ' ' + REP.title : D.title || D.id;
let h = '<div class="eyebrow"><a href="/" class="rs-back">← 받은편지함</a> <button type="button" class="rs-refresh" id="rs-refresh" title="이 시트 새로고침(제출된 답 다시 불러오기)">↻ 새로고침</button>' + (D.eyebrow ? ' · ' + e(D.eyebrow) : '') + (D.from ? ' · ' + e(D.from) : '') + '</div>' +
  '<div class="rs-sub" id="rs-sub" hidden></div><h1>' + (REP ? '<span class="rs-repbadge">' + e(REP.label) + '</span>' + e(REP.title) : e(D.title || D.id)) + '</h1>' +
  (D.lede ? '<p class="lede">' + D.lede + '</p>' : '') +
  '<div class="v-howto">' + (REP ? '<b>보고</b> — 읽고 아래 <b>☐ 확인</b>만 누르면 끝(세션을 깨우지 않는다). 할 말이 있으면 메모 후 <b>의견 보내기</b>.' : D.howto || '<b>답하는 법</b> — 선택지를 탭해 고르고(다시 탭 = 취소), 필요하면 메모. <b>빈 칸 = 추천</b> 은 안 고른 질문을 추천으로 채운다. 끝나면 <b>제출</b> — 위에 “✓ 제출됨” 띠가 뜨면 끝.') + '</div>';
h += '<nav class="toc">' + D.sections.map(s => '<a href="#' + e(s.id || s.code) + '">' + e((s.code ? s.code + ' ' : '') + String(s.title || '').split(' — ')[0]) + '</a>').join('') + '</nav>';

if (!REP) h += '<section class="box" id="summary"><h2>한눈에 — 추천</h2>' + D.sections.map((s, si) =>
  '<div class="v-srow"><a href="#' + e(s.id || s.code) + '">' + e(s.code || (si + 1)) + '</a><div><div>' + e(s.title) + (s.first ? '<span class="v-first">먼저</span>' : '') +
  '</div><div class="r">' + (s.questions || []).map(norm).map(q => e(q.k) + '=' + e(q.rec || '—')).join(' · ') + '</div></div></div>').join('') + '</section>';

/* links + images of a section or a question. Question-level ones sit right under the question text so the
   reviewer never scrolls between a picture pile and the question it belongs to (hero 2026-10-02). */
/* attach row under every memo: 📎 picks files; pasting into the memo or dropping onto the question attaches too. */
const CLR = '<button type="button" class="rs-clear" title="모두 지우기" aria-label="메모 모두 지우기">✕</button>';   // web/compose.js — 글 있을 때만 보임
// 메모칸은 한 줄을 다 쓰고, 📎·🎤 은 그 아래 줄에(hero 2026-10-09 — 칸 옆에 붙어 칸이 쪼개지던 것)
const ATT = '<div class="v-att"><label class="v-clip" title="파일 첨부 (붙여넣기·끌어놓기도 된다)">📎 파일<input type="file" multiple hidden></label>' + MIC + '<span class="v-files"></span></div>';
/* 문항 질문 (hero 2026-10-16) — '＋ 이것만 묻기': 그 문항 하나만 담당 세션에 묻고(제출 아님), 답은 그 문항 밑에 바로 뜬다. */
const ASKQ = label => '<button type="button" class="v-askq-b" data-label="' + e(String(label || '').replace(/<[^>]*>/g, '').slice(0, 120)) + '" aria-expanded="false">＋ 이것만 묻기</button>';
const ASKBOX = '<div class="v-askq-log"></div><div class="v-askq" hidden><textarea class="v-askq-t" rows="2" placeholder="이 문항에 대해서만 묻기 — 고른 답·메모는 안 보내요"></textarea><div class="v-att"><button type="button" class="save v-askq-go">묻기</button><span class="v-askq-msg"></span></div></div>';
const attAsk = label => ATT.replace('<span class="v-files"></span>', ASKQ(label) + '<span class="v-files"></span>') + ASKBOX;
const media = o => {
  let m = '';
  if(o.links && o.links.length) m += '<div class="v-links">' + o.links.map(([t, u]) => '<button type="button" class="v-link" data-u="' + e(u) + '" data-t="' + e(t) + '">' + e(t) + ' ▾</button>').join('') + '</div>';
  if(o.images && o.images.length) m += '<div class="rs-imgs">' + o.images.map(x => { const [src, cap] = Array.isArray(x) ? x : [x]; return '<figure><img class="rs-img" src="' + e(src) + '" alt="' + e(cap || '') + '">' + (cap ? '<figcaption>' + e(cap) + '</figcaption>' : '') + '</figure>'; }).join('') + '</div>';
  return m;
};
for(const s of D.sections){
  const sid = s.id || s.code;
  h += '<section class="box" id="' + e(sid) + '"><div class="eyebrow">' + (s.code ? e(s.code) : '') +
    (s.issue ? (s.code ? ' · ' : '') + '<a href="' + e(issueHref(s.issue)) + '" target="_blank" rel="noopener">' + e(issueText(s.issue)) + '</a>' : '') +
    (s.first ? '<span class="v-first">먼저</span>' : '') + '</div>' +
    '<h2>' + e(s.title) + '</h2>' +
    (s.ask ? '<div class="v-ask">' + e(s.askLabel || 'hero') + ': “' + m(s.ask) + '”</div>' : '') +
    (s.now ? '<p class="v-now"><b>' + e(s.nowLabel || '지금') + '</b> — ' + m(s.now) + '</p>' : '');
  h += media(s);
  if(s.html) h += '<div class="rs-html">' + s.html + '</div>';
  if(s.flow) h += '<div class="v-flow">' + s.flow.map((f, i) => '<span class="s' + (i === 1 ? ' x' : '') + '">' + e(f) + '</span>').join('<span class="v-arrow">→</span>') + '</div>';
  if(s.table) h += tbl(s.table);
  /* 🔒 비밀 칸 (2026-10-14) — 붙여넣은 값은 "AWS 에 저장" 을 누르는 순간 서버가 검사 후 SSM 으로 넘기고 버린다.
     .v-q 가 아니라서 제출(답 파일)에는 들어가지 않는다. 화면엔 결과(vN)만. */
  h += (s.secrets || []).map(x => '<div class="v-sec" data-sec="' + e(x.k) + '"><div class="v-qh"><span class="n">🔒</span><span>' + m(x.label || x.ssm) + '</span><span class="v-rec v-sec-st">미저장</span></div>' +
    (x.hint ? '<div class="v-ctx"><div>' + m(x.hint) + '</div></div>' : '') +
    (x.check === 'pem' ? '<div class="v-att"><label class="v-clip">📄 파일 고르기<input type="file" class="v-sec-file" hidden></label></div><textarea class="v-memo v-sec-v" rows="4" autocomplete="off" spellcheck="false" placeholder="-----BEGIN … PRIVATE KEY----- 전체 붙여넣기 (또는 위에서 파일 고르기)"></textarea>'
      : '<input type="password" class="v-memo v-sec-v" autocomplete="off" placeholder="붙여넣기">') +
    '<div class="v-att"><button type="button" class="save v-sec-go">AWS 에 저장</button> <span class="v-sec-msg"></span></div></div>').join('');
  h += (s.questions || []).map(norm).map(o => {
    const { k, q: t, opts, rec, why } = o;
    const tok = String(rec).split(' ')[0];
    const ctx = o.sit || o.decide || o.effect ? '<div class="v-ctx">' + (o.sit ? '<div><b>지금 상황</b>' + m(o.sit) + '</div>' : '') + (o.decide ? '<div><b>정하는 것</b>' + m(o.decide) + '</div>' : '') + (o.effect ? '<div><b>고르면 달라지는 것</b>' + m(o.effect) + '</div>' : '') + '</div>' : '';
    return '<div class="v-q" data-q="' + e(s.code + '-' + k) + '"><div class="v-qh"><span class="n">' + e(k) + '</span><span>' + m(t) + '</span>' + (rec ? '<span class="v-rec">추천 ' + e(rec) + '</span>' : '') + '</div>' + ctx + media(o) + '<ul>' +
      opts.map(([lb, ex, img], i) => '<li data-i="' + i + '" data-t="' + e(lb) + '"' + (opts.length > 1 && tok && String(lb).startsWith(tok + ' ') ? ' class="on"' : '') + '><span class="dot"></span><span>' + m(lb) +
        (ex ? '<span class="ex">예: ' + m(ex) + '</span>' : '') + '</span>' + (img ? '<img src="' + e(img) + '" alt="">' : '') + '</li>').join('') + '</ul>' +
      (why ? '<p class="v-why">' + m(why) + '</p>' : '') +
      '<div class="v-memo-row"><textarea class="v-memo" rows="1" placeholder="메모 · 다른 안 (선택 안 하고 여기만 써도 된다)"></textarea>' + CLR + '</div>' + attAsk(k + ' ' + t) + '</div>';
  }).join('') + '<div class="v-q" data-q="' + e(s.code + '-memo') + '"><div class="v-qh"><span>' + e(s.code) + ' 전체 메모</span></div><div class="v-memo-row"><textarea class="v-memo" rows="2" placeholder="이 항목 전체에 대한 말"></textarea>' + CLR + '</div>' + attAsk((s.code ? s.code + ' ' : '') + s.title) + '</div></section>';
}
/* 추가 질문 (hero 2026-10-13) — 시트에 없는 것을 hero 가 되묻는 칸. 저장하면 보낸 세션 채널에 알림이 가고, 세션은 채팅으로 답한다. */
h += '<section class="box v-askbox"><h2>추가 질문</h2><p class="v-now">위 항목에 없는 것을 물어보세요. 저장하면 이 시트를 보낸 세션에 알림이 가고, 채팅으로 답이 옵니다.</p>' +
  '<div class="v-q" data-q="_ask"><div class="v-memo-row"><textarea class="v-memo" rows="3" placeholder="궁금한 것 · 더 알고 싶은 것"></textarea>' + CLR + '</div>' + ATT + '</div></section>';
h += '<div class="rs-pop" id="rs-pop" hidden><div class="rs-pop-bar"><b id="rs-pop-t"></b><a id="rs-pop-ext" href="#" target="_blank" rel="noopener">새 탭 ↗</a><button type="button" id="rs-pop-full" title="전체 화면">⤢</button><button type="button" id="rs-pop-x">닫기 ✕</button></div><iframe id="rs-pop-f" title="미리보기"></iframe></div>';
h += '<button type="button" class="v-askq-toast" id="v-askq-toast" hidden>💬 물어본 문항에 답이 왔어요 — 보기</button>';
h += '<div class="v-bar"><a class="inbox" href="/" id="v-inbox" title="받은편지함으로">📥<span> 편지함</span></a><button class="all" type="button" id="v-all">빈 칸 = 추천</button><span class="st" id="v-st">고르고 · 적고 · 저장</span>' + (REP ? '<button class="chk" type="button" id="v-chk" title="⌘+Enter — 확인만, 세션은 안 깨운다" aria-pressed="false">☐ 확인</button>' : '') + '<button class="save" type="button" id="v-save" title="' + (REP ? '메모·추가 질문을 세션에 보낸다' : '⌘+Enter') + '">' + (REP ? '의견 보내기' : '제출') + '</button></div>';
document.getElementById('app').innerHTML = h;

/* links open INSIDE this page (hero 2026-10-01: no hopping between windows): an inline panel right under the
   link row (same button again = close), with ⤢ for full screen and Esc to close. A site that refuses framing
   (GitHub) shows blank — the "새 탭" link in the panel bar is the way out. */
const pop = document.getElementById('rs-pop'), popF = document.getElementById('rs-pop-f'), popT = document.getElementById('rs-pop-t'), popX = document.getElementById('rs-pop-ext');
let popBtn = null;
const closePop = () => { pop.hidden = true; pop.classList.remove('full'); popF.removeAttribute('srcdoc'); popF.src = 'about:blank'; if(popBtn) popBtn.classList.remove('open'); popBtn = null; document.body.classList.remove('rs-locked'); };
// An image opens fitted to the popup's width (tap = actual size, scroll to pan) — a bare image URL in the
// iframe showed at its pixel size, wider than a phone, and could not be zoomed out (hero 2026-10-08).
const imgDoc = url => '<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#E9E7E2}img{display:block;max-width:100%;height:auto;margin:0 auto;cursor:zoom-in}body.real img{max-width:none;cursor:zoom-out}</style><img src="' + url.replace(/"/g, '&quot;') + '" onclick="document.body.classList.toggle(\'real\')">';
const openPop = (anchor, title, url, btn, isImg) => {
  if(popBtn) popBtn.classList.remove('open');
  popBtn = btn || null; if(btn) btn.classList.add('open');
  popT.textContent = title; popX.href = url;
  if(isImg) popF.srcdoc = imgDoc(url); else { popF.removeAttribute('srcdoc'); popF.src = url; }
  anchor.after(pop); pop.hidden = false;
  pop.scrollIntoView({ block: 'nearest' });
};
document.getElementById('app').addEventListener('click', ev => {
  const b = ev.target.closest('.v-link'); if(!b) return;
  if(popBtn === b){ closePop(); return; }
  openPop(b.closest('.v-links'), b.dataset.t, b.dataset.u, b);
});
document.getElementById('app').addEventListener('click', ev => {
  const im = ev.target.closest('img.rs-img, .v-q li img'); if(!im) return;
  const row = im.closest('.rs-imgs') || im.closest('.v-q ul');
  openPop(row, im.alt || im.getAttribute('src'), im.src, null, true);
});
document.getElementById('rs-pop-x').addEventListener('click', closePop);
document.getElementById('rs-pop-full').addEventListener('click', () => { const on = pop.classList.toggle('full'); document.body.classList.toggle('rs-locked', on); });
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && !pop.hidden) closePop(); });
/* ⌘/Ctrl+Enter = 제출 (hero 2026-10-14). IME 조합 중 Enter 는 무시. */
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter' || !(ev.metaKey || ev.ctrlKey) || ev.isComposing || ev.keyCode === 229) return;
  ev.preventDefault(); const b = chkBtn || saveBtn; if(!b.disabled) b.click();
});

/* answers: tap an option to pick (tap again to clear), memo per question. */
const KEY = 'review-sheet-' + D.id;
const st = document.getElementById('v-st');
const collect = () => {
  const out = { sheet: D.id, issues: D.sections.map(x => x.issue).filter(Boolean), answers: {} };
  document.querySelectorAll('.v-q[data-q]').forEach(q => {
    const li = q.querySelector('li.pick'), memo = q.querySelector('textarea').value.trim();
    const files = [...q.querySelectorAll('.v-file[data-name]')].map(x => ({ name: x.dataset.name, orig: x.dataset.orig }));
    if(!li && !memo && !files.length) return;
    const a = {};
    if(li) a.pick = li.dataset.t;
    if(memo) a.memo = memo;
    if(files.length) a.files = files;
    out.answers[q.dataset.q] = a;
  });
  return out;
};
const markSubmitted = savedAt => {
  const b = document.getElementById('rs-sub');
  if(!savedAt){ b.hidden = true; document.body.classList.remove('rs-submitted'); return; }
  b.hidden = false; document.body.classList.add('rs-submitted');
  b.innerHTML = '<b>✓ 제출됨</b> ' + new Date(savedAt).toLocaleString('ko-KR') + ' — 아래는 제출한 답이다. 고쳐서 <b>다시 제출</b>하면 덮어쓴다.';
  document.title = '✓ ' + (D.title || D.id);
  saveBtn.textContent = REP ? '의견 다시 보내기' : '수정해서 다시 제출';
};
/* ✓ 확인 (보고 시트) — /__check 에만 남는다. answers 를 안 써서 wait 중인 세션이 깨지 않는다 */
const chkBtn = document.getElementById('v-chk');
const markChecked = at => {
  if(!chkBtn) return;
  chkBtn.classList.toggle('on', !!at); chkBtn.setAttribute('aria-pressed', !!at);
  chkBtn.textContent = at ? '✓ 확인함' : '☐ 확인';
  document.body.classList.toggle('rs-checked', !!at);
  if(at){ st.className = 'st ok'; st.textContent = '✓ 확인 ' + new Date(at).toLocaleString('ko-KR'); }
  else if(st.classList.contains('ok')){ st.className = 'st'; st.textContent = '확인 안 함'; }
};
if(chkBtn){
  chkBtn.addEventListener('click', async () => {
    chkBtn.disabled = true;
    try {
      const r = await fetch('/__check?d=' + encodeURIComponent(SHEET_NAME), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ on: !chkBtn.classList.contains('on') }) });
      if(!r.ok) throw new Error(await r.text() || ('HTTP ' + r.status));
      markChecked((await r.json()).checkedAt);
    } catch(err){ st.className = 'st bad'; st.textContent = '✗ 확인 실패(' + err.message + ')'; }
    finally { chkBtn.disabled = false; }
  });
}
const apply = saved => {
  const A = (saved && saved.answers) || {};
  document.querySelectorAll('.v-q[data-q]').forEach(q => {
    const a = A[q.dataset.q]; if(!a) return;
    if(a.pick) q.querySelectorAll('li').forEach(li => li.classList.toggle('pick', li.dataset.t === a.pick));
    if(a.memo) q.querySelector('textarea').value = a.memo;
    (a.files || []).forEach(f => chip(q, f.name, f.orig));
  });
};
const saveBtn = document.getElementById('v-save');
const count = () => { const n = document.querySelectorAll('li.pick').length, all = document.querySelectorAll('.v-q ul').length; return n + '/' + all + ' 고름'; };
const draft = () => { try { localStorage.setItem(KEY, JSON.stringify(collect())); } catch(_){} st.className = 'st'; st.textContent = count() + ' · 제출 안 됨'; };
document.getElementById('app').addEventListener('click', ev => {
  const li = ev.target.closest('.v-q li'); if(!li || ev.target.closest('img')) return;
  const on = li.classList.contains('pick');
  li.parentNode.querySelectorAll('li').forEach(x => x.classList.remove('pick'));
  if(!on) li.classList.add('pick');
  draft();
});
document.getElementById('app').addEventListener('input', ev => { if(ev.target.matches('textarea')) draft(); });
/* attachments: each file uploads right away (so a draft only ever holds names the server has), then shows as a chip —
   images as a thumbnail, others as a name — with ✕ to drop it from the answer. */
const IMGX = /\.(png|jpe?g|gif|webp)$/i;
const fileUrl = name => '/answers/' + encodeURIComponent(D.id) + '.files/' + encodeURIComponent(name);
const chip = (q, name, orig, busy) => {
  const c = document.createElement('span'); c.className = 'v-file' + (busy ? ' busy' : '');
  if(name){ c.dataset.name = name; c.dataset.orig = orig; }
  const a = document.createElement('a'); a.target = '_blank'; a.rel = 'noopener';
  if(name) a.href = fileUrl(name);
  if(name && IMGX.test(name)){ const im = document.createElement('img'); im.src = fileUrl(name); im.alt = orig; a.append(im); }
  else a.textContent = (busy ? '⏳ ' : '📄 ') + orig;
  const x = document.createElement('button'); x.type = 'button'; x.textContent = '✕'; x.setAttribute('aria-label', '빼기');
  x.addEventListener('click', () => { c.remove(); draft(); });
  c.append(a, x); q.querySelector('.v-files').append(c); return c;
};
const attach = async (q, files) => {
  for(const f of files){
    const orig = f.name || ('붙여넣기-' + new Date().toISOString().slice(11, 19).replace(/:/g, '') + '.' + ((f.type.split('/')[1] || 'bin').replace('jpeg', 'jpg')));
    const tmp = chip(q, '', orig, true);
    try {
      const r = await fetch('/__answers/file?sheet=' + encodeURIComponent(D.id) + '&n=' + encodeURIComponent(orig), { method: 'POST', headers: { 'content-type': f.type || 'application/octet-stream' }, body: f });
      if(!r.ok) throw new Error(await r.text() || ('HTTP ' + r.status));
      const j = await r.json(); tmp.remove(); chip(q, j.name, orig);
    } catch(err){ tmp.remove(); st.className = 'st bad'; st.textContent = '✗ 첨부 실패(' + orig + ': ' + err.message + ')'; continue; }
    draft();
  }
};
document.getElementById('app').addEventListener('change', ev => {
  const inp = ev.target.closest('.v-clip input'); if(!inp) return;
  attach(inp.closest('.v-q'), [...inp.files]); inp.value = '';
});
document.getElementById('app').addEventListener('paste', ev => {
  const q = ev.target.closest && ev.target.closest('.v-q'); if(!q) return;
  const fs = [...(ev.clipboardData && ev.clipboardData.files || [])]; if(!fs.length) return;
  ev.preventDefault(); attach(q, fs);
});
document.getElementById('app').addEventListener('dragover', ev => { const q = ev.target.closest('.v-q'); if(q && [...ev.dataTransfer.types].includes('Files')){ ev.preventDefault(); q.classList.add('drop'); } });
document.getElementById('app').addEventListener('dragleave', ev => { const q = ev.target.closest('.v-q'); if(q && !q.contains(ev.relatedTarget)) q.classList.remove('drop'); });
document.getElementById('app').addEventListener('drop', ev => {
  const q = ev.target.closest('.v-q'); if(!q || !ev.dataTransfer.files.length) return;
  ev.preventDefault(); q.classList.remove('drop'); attach(q, [...ev.dataTransfer.files]);
});
document.getElementById('v-all').addEventListener('click', () => {
  document.querySelectorAll('.v-q ul').forEach(ul => { if(!ul.querySelector('li.pick')){ const r = ul.querySelector('li.on'); if(r) r.classList.add('pick'); } });
  draft();
});
saveBtn.addEventListener('click', async () => {
  const body = collect();
  if(!Object.keys(body.answers).length){ st.className = 'st bad'; st.textContent = '아직 고른 게 없어요 — 하나 고르거나 메모를 남기면 제출돼요'; return; }   // 빈 제출 = 제출됨 아님 (#43)
  try { localStorage.setItem(KEY, JSON.stringify(body)); } catch(_){}
  saveBtn.disabled = true; saveBtn.textContent = '저장 중…'; st.className = 'st'; st.textContent = '저장 중…';
  try {
    const r = await fetch('/__answers?sheet=' + encodeURIComponent(D.id), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    st.className = 'st ok';
    st.textContent = '✓ 제출됨 ' + new Date(j.savedAt).toLocaleTimeString('ko-KR') + ' · ' + count();
    saveBtn.textContent = '✓ 제출됨';
    setTimeout(() => markSubmitted(j.savedAt), 2500);
  } catch(err){
    st.className = 'st bad';
    st.textContent = '✗ 저장 실패(' + err.message + ') — 이 기기에는 남아 있다. 세션에 알려 줘';
    saveBtn.textContent = '다시 저장';
  } finally { saveBtn.disabled = false; }
});
(async () => {
  let saved = null;
  try { const r = await fetch('/__answers?sheet=' + encodeURIComponent(D.id), { cache: 'no-store' }); if(r.ok) saved = await r.json(); } catch(_){}
  if(!saved || !saved.answers){ try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(_){} }
  apply(saved);
  markSubmitted(saved && saved.savedAt);
  st.textContent = count() + (saved && saved.savedAt ? ' · 제출 ' + new Date(saved.savedAt).toLocaleString('ko-KR') : ' · 아직 제출 안 함');
  if(chkBtn){ try { const r = await fetch('/__check?d=' + encodeURIComponent(SHEET_NAME), { cache: 'no-store' }); if(r.ok) markChecked((await r.json()).checkedAt); } catch(_){} }
})();
/* 문항 질문 — 열기·보내기·답 불러오기. 화면이 보일 때 답 기다리는 질문이 있으면 5초, 없으면 20초마다 다시 읽는다. */
const askEsc = t => e(t).replace(/\n/g, '<br>');
const askAgo = ts => new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
let askTimer = null, askSeen = null;
const askLoad = async () => {
  let list = [];
  try { const r = await fetch('/api/asks?d=' + encodeURIComponent(SHEET_NAME), { cache: 'no-store' }); if(r.ok) list = await r.json(); } catch(_){ return; }
  document.querySelectorAll('.v-q[data-q]').forEach(q => {
    const log = q.querySelector('.v-askq-log'); if(!log) return;
    const mine = list.filter(a => a.q === q.dataset.q);
    log.innerHTML = mine.map(a => '<div class="v-askq-item"><div class="me"><b>❓ 질문</b> <span class="t">' + askAgo(a.ts) + '</span><div>' + askEsc(a.text) + '</div></div>' +
      (a.replies.length ? a.replies.map(r => '<div class="re"><b>💬 ' + e(r.from) + '</b> <span class="t">' + askAgo(r.ts) + '</span><div>' + askEsc(r.text) + '</div></div>').join('')
        : '<div class="re wait">답 기다리는 중… 답이 오면 바로 여기 뜹니다 — 다른 데 가서 볼 필요 없어요</div>') + '</div>').join('');
  });
  // 보고 있는 중에 답이 오면: 그 문항을 잠깐 강조하고 아래 띠에 '답 왔어요' — 누르면 그 자리로
  const ids = list.flatMap(a => a.replies.map(r => a.id + r.ts));
  if(askSeen){ const fresh = list.filter(a => a.replies.some(r => !askSeen.has(a.id + r.ts)));
    fresh.forEach(a => { const q = document.querySelector('.v-q[data-q="' + CSS.escape(a.q) + '"]'); if(!q) return; const it = q.querySelector('.v-askq-log'); it.classList.remove('flash'); void it.offsetWidth; it.classList.add('flash');
      const t = document.getElementById('v-askq-toast'); t.hidden = false; t.onclick = () => { it.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.hidden = true; }; }); }
  askSeen = new Set(ids);
  clearTimeout(askTimer);
  askTimer = setTimeout(() => { if(!document.hidden) askLoad(); }, list.some(a => !a.replies.length) ? 5000 : 20000);
};
document.addEventListener('visibilitychange', () => { if(!document.hidden) askLoad(); });
document.getElementById('app').addEventListener('click', async ev => {
  const b = ev.target.closest && ev.target.closest('.v-askq-b');
  if(b){ const box = b.closest('.v-q').querySelector('.v-askq'); box.hidden = !box.hidden; b.setAttribute('aria-expanded', String(!box.hidden)); if(!box.hidden) box.querySelector('textarea').focus(); return; }
  const go = ev.target.closest && ev.target.closest('.v-askq-go'); if(!go) return;
  const q = go.closest('.v-q'), box = q.querySelector('.v-askq'), ta = box.querySelector('textarea'), msg = box.querySelector('.v-askq-msg');
  const text = ta.value.trim(); if(!text){ msg.textContent = '질문이 비었습니다'; return; }
  go.disabled = true; msg.textContent = '보내는 중…';
  try {
    const r = await fetch('/__ask?d=' + encodeURIComponent(SHEET_NAME), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ q: q.dataset.q, label: q.querySelector('.v-askq-b').dataset.label, text }) });
    const t = await r.text(); if(!r.ok) throw new Error(t);
    ta.value = ''; box.hidden = true; q.querySelector('.v-askq-b').setAttribute('aria-expanded', 'false'); msg.textContent = '';
    askLoad();
  } catch(err){ msg.textContent = '✗ ' + err.message; }
  finally { go.disabled = false; }
});
askLoad();
/* 🔒 비밀 칸 — 값은 이 버튼으로만 서버에 가고(SSM 저장), localStorage·답 파일엔 안 들어간다. */
const secMark = (box, v) => { const t = box.querySelector('.v-sec-st'); t.textContent = '저장됨 v' + v.version; t.classList.add('ok'); };
document.querySelectorAll('.v-sec').forEach(box => {
  const fi = box.querySelector('.v-sec-file'), ta = box.querySelector('.v-sec-v'), msg = box.querySelector('.v-sec-msg'), go = box.querySelector('.v-sec-go');
  if(fi) fi.addEventListener('change', () => { const f = fi.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { ta.value = r.result; msg.textContent = f.name + ' 읽음 — AWS 에 저장을 누르세요'; }; r.readAsText(f); fi.value = ''; });
  go.addEventListener('click', async () => {
    if(!ta.value.trim()){ msg.textContent = '값이 비었습니다'; return; }
    go.disabled = true; msg.textContent = '검사·저장 중…';
    try {
      const r = await fetch('/__secret?sheet=' + encodeURIComponent(D.id) + '&k=' + encodeURIComponent(box.dataset.sec), { method: 'POST', headers: { 'content-type': 'text/plain' }, body: ta.value });
      const t = await r.text();
      if(!r.ok) throw new Error(t);
      const j = JSON.parse(t); ta.value = '';
      secMark(box, j); msg.textContent = '✓ 저장됨 v' + j.version + ' · ' + j.done + '/' + j.total + (j.done === j.total ? ' — 다 됐습니다. 세션이 이어서 진행합니다' : '');
    } catch(err){ msg.textContent = '✗ ' + err.message; }
    finally { go.disabled = false; }
  });
});
if(document.querySelector('.v-sec')) fetch('/__secret?sheet=' + encodeURIComponent(D.id), { cache: 'no-store' }).then(r => r.json()).then(st => document.querySelectorAll('.v-sec').forEach(b => { if(st[b.dataset.sec]) secMark(b, st[b.dataset.sec]); })).catch(() => {});
document.getElementById('rs-refresh').addEventListener('click', () => location.reload());
const go = new URLSearchParams(location.search).get('s') || location.hash.slice(1);
if(go){ const t = document.getElementById(go); if(t) t.scrollIntoView(); }
};
</script>
</body>
</html>
