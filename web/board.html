<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="리뷰시트"><script src="/push.js" defer></script>
<title>진행판</title><link rel="stylesheet" href="/sheet.css">
<style>
.bd-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.bd-chip{padding:6px 12px;min-height:34px;border-radius:16px;border:1px solid #CFCBC2;background:#fff;font:700 13px system-ui,sans-serif;color:#222;cursor:pointer}
.bd-chip.on{background:#2B2A27;color:#F3E6C4;border-color:#2B2A27}
.bd-stale{padding:8px 12px;border-radius:8px;background:#F6DED6;color:#8E3320;font-size:13.5px;margin:0 0 12px}
.bd-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.bd-col{background:#F4F2EE;border-radius:12px;padding:10px}
.bd-col h2{display:flex;justify-content:space-between;font-size:15px;margin:2px 4px 8px}
.bd-col h2 small{color:#777;font-weight:700}
.bd-card{display:block;background:#fff;border-radius:10px;padding:10px 12px;margin:0 0 8px;box-shadow:0 1px 2px rgba(0,0,0,.08);color:#222;text-decoration:none;border-left:4px solid #CFCBC2}
.bd-card.p0{border-left-color:#B2472F}.bd-card.p1{border-left-color:#D08A2E}.bd-card.p2{border-left-color:#8A6D2E}
.bd-card b{display:block;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.bd-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12.5px;color:#555;align-items:center}
.bd-pri{font:800 11.5px/1.6 system-ui,sans-serif;padding:0 7px;border-radius:4px;background:#EEE9DE;color:#5A4A22}
.bd-card.p0 .bd-pri{background:#B2472F;color:#fff}.bd-card.p1 .bd-pri{background:#D08A2E;color:#fff}
.bd-mode{font:700 12px/1.6 system-ui,sans-serif;padding:0 8px;border-radius:10px}
.bd-mode.claude{background:#DDF0E2;color:#1F6B3A}
.bd-mode.system{background:#DCE7F5;color:#244E86}
.bd-mode.idle{background:#ECEAE5;color:#666}
.bd-own{font-weight:700;color:#333}
.bd-note{font-size:12.5px;color:#666;margin-top:4px;overflow-wrap:anywhere}
.bd-empty{color:#888;font-size:13px;padding:6px 4px}
.bd-more{width:100%;min-height:36px;border:1px dashed #CFCBC2;border-radius:8px;background:transparent;font:700 13px system-ui,sans-serif;color:#555;cursor:pointer}
@media (max-width:760px){.bd-cols{grid-template-columns:1fr}.bd-col.doing{order:-1}}
</style>
<body class="rs-page"><main>
<div class="eyebrow"><a href="/">REVIEW-SHEET</a> · 진행판</div><h1 id="bd-title">진행판</h1>
<p class="lede">보기 전용 — 일은 이슈에서 바뀐다. <span id="bd-upd"></span></p>
<div id="bd-stale" class="bd-stale" hidden></div>
<div class="bd-top" id="bd-groups"></div>
<div class="bd-top" id="bd-modes"></div>
<div class="bd-cols" id="bd-cols"></div>
</main>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}); };
const COLS = [['todo', '할 일'], ['doing', '하는 중'], ['done', '끝']];
const MODE = { claude: '클로드 직접 작업', system: '시스템 대기', idle: '맡은 일 · 대기' };
const RANK = { p0: 0, p1: 1, p2: 2, p3: 3, '긴급': 0, '높음': 1, '중간': 2, '낮음': 3 };
const rank = p => { const k = String(p || '').toLowerCase(); return k in RANK ? RANK[k] : 9; };
const pcls = p => { const r = rank(p); return r <= 2 ? ' p' + r : ''; };
const ui = { group: '', mode: '', more: {} };
try { Object.assign(ui, JSON.parse(localStorage.getItem('bd-ui') || '{}'), { more: {} }); } catch {}
const save = () => { try { localStorage.setItem('bd-ui', JSON.stringify({ group: ui.group, mode: ui.mode })); } catch {} };
let last = null;

const card = c => '<a class="bd-card' + pcls(c.priority) + '"' + (c.url ? ' href="' + esc(c.url) + '" target="_blank" rel="noopener"' : '') + '>' +
  '<b>' + esc(c.title) + '</b><div class="bd-meta">' +
  (c.priority ? '<span class="bd-pri">' + esc(c.priority) + '</span>' : '') +
  (c.mode ? '<span class="bd-mode ' + c.mode + '">' + MODE[c.mode] + (c.modeNote ? ' · ' + esc(c.modeNote) : '') + '</span>' : '') +
  (c.owner && c.owner.length ? '<span class="bd-own">' + c.owner.map(esc).join(', ') + '</span>' : (c.status === 'todo' ? '' : '<span>담당 없음</span>')) +
  (c.id ? '<span>' + esc(c.id) + '</span>' : '') + (c.at ? '<span>' + when(c.at) + '</span>' : '') +
  '</div>' + (c.note ? '<div class="bd-note">' + esc(c.note) + '</div>' : '') + '</a>';

const chips = (el, key, items, all) => {
  el.innerHTML = items.length < 2 ? '' : [['', all]].concat(items).map(([v, label]) =>
    '<button type="button" class="bd-chip' + (ui[key] === v ? ' on' : '') + '" data-k="' + key + '" data-v="' + esc(v) + '">' + esc(label) + '</button>').join('');
};

function render(b) {
  const cols = document.getElementById('bd-cols'), stale = document.getElementById('bd-stale');
  if (!b) { cols.innerHTML = '<p class="bd-empty">아직 진행판이 없다 — 생산자가 <code>review-sheet board</code> 로 board.json 을 써야 한다.</p>'; return; }
  document.getElementById('bd-title').textContent = b.title || '진행판';
  document.getElementById('bd-upd').textContent = '갱신 ' + when(b.updatedAt) + (b.source ? ' · ' + b.source : '');
  const age = (Date.now() - new Date(b.updatedAt)) / 60000;
  stale.hidden = !(age > 10);
  if (age > 10) stale.textContent = Math.round(age) + '분째 갱신 없음 — 생산자가 멈췄을 수 있다. 아래는 그때 상태다.';
  const groups = [...new Set(b.cards.map(c => c.group).filter(Boolean))].sort();
  if (ui.group && !groups.includes(ui.group)) ui.group = '';
  chips(document.getElementById('bd-groups'), 'group', groups.map(g => [g, g + ' ' + b.cards.filter(c => c.group === g && c.status !== 'done').length]), '전체');
  const doing = b.cards.filter(c => c.status === 'doing' && (!ui.group || c.group === ui.group));
  const modes = Object.keys(MODE).filter(m => doing.some(c => c.mode === m));
  if (ui.mode && !modes.includes(ui.mode)) ui.mode = '';
  chips(document.getElementById('bd-modes'), 'mode', modes.map(m => [m, MODE[m] + ' ' + doing.filter(c => c.mode === m).length]), '하는 중 전부 ' + doing.length);
  const pick = st => b.cards.filter(c => c.status === st && (!ui.group || c.group === ui.group) && (st !== 'doing' || !ui.mode || c.mode === ui.mode))
    .sort((x, y) => st === 'done' ? String(y.at || '').localeCompare(String(x.at || '')) : rank(x.priority) - rank(y.priority) || String(y.at || '').localeCompare(String(x.at || '')));
  cols.innerHTML = COLS.map(([st, label]) => {
    const list = pick(st), shown = st !== 'doing' && !ui.more[st] ? list.slice(0, 12) : list;
    return '<section class="bd-col ' + st + '"><h2>' + label + '<small>' + list.length + '</small></h2>' +
      (shown.length ? shown.map(card).join('') : '<p class="bd-empty">없음</p>') +
      (shown.length < list.length ? '<button type="button" class="bd-more" data-st="' + st + '">' + label + ' ' + (list.length - shown.length) + '개 더 보기</button>' : '') + '</section>';
  }).join('');
}

document.addEventListener('click', e => {
  const t = e.target.closest('.bd-chip, .bd-more'); if (!t) return;
  if (t.dataset.st) ui.more[t.dataset.st] = true; else { ui[t.dataset.k] = t.dataset.v; save(); }
  render(last);
});
async function load() {
  try { const r = await fetch('/api/board', { cache: 'no-store' }); last = (await r.json()).board; render(last); }
  catch { document.getElementById('bd-upd').textContent = '서버 연결 안 됨 — 다시 시도 중'; }
}
load(); setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
