<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="리뷰시트"><script src="/push.js" defer></script>
<title>진행판</title><link rel="stylesheet" href="/sheet.css">
<style>
.bd-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.bd-chip{padding:6px 12px;min-height:34px;border-radius:16px;border:1px solid #CFCBC2;background:#fff;font:700 13px system-ui,sans-serif;color:#222;cursor:pointer}
.bd-chip.on{background:#2B2A27;color:#F3E6C4;border-color:#2B2A27}
.bd-stale{padding:8px 12px;border-radius:8px;background:#F6DED6;color:#8E3320;font-size:13.5px;margin:0 0 12px}
.bd-cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start}
.bd-col{background:#F4F2EE;border-radius:12px;padding:10px}
.bd-col h2{display:flex;justify-content:space-between;font-size:15px;margin:2px 4px 8px}
.bd-col h2 small{color:#777;font-weight:700}
.bd-split{font-weight:400;font-size:12px}
.bd-cw{margin:0 0 8px;min-width:0}
.bd-card{display:block;background:#fff;border-radius:10px;padding:10px 12px;margin:0;box-shadow:0 1px 2px rgba(0,0,0,.08);color:#222;text-decoration:none;border-left:4px solid #CFCBC2}
.bd-card.p0{border-left-color:#B2472F}.bd-card.p1{border-left-color:#D08A2E}.bd-card.p2{border-left-color:#8A6D2E}
.bd-card b{display:block;font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.bd-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12.5px;color:#555;align-items:center}
.bd-pri{font:800 11.5px/1.6 system-ui,sans-serif;padding:0 7px;border-radius:4px;background:#EEE9DE;color:#5A4A22}
.bd-card.p0 .bd-pri{background:#B2472F;color:#fff}.bd-card.p1 .bd-pri{background:#D08A2E;color:#fff}
.bd-mode{font:700 12px/1.6 system-ui,sans-serif;padding:0 8px;border-radius:10px}
.bd-mode.claude{background:#DDF0E2;color:#1F6B3A}
.bd-mode.system{background:#DCE7F5;color:#244E86}
.bd-mode.idle{background:#ECEAE5;color:#666}
.bd-stall{font:700 12px/1.6 system-ui,sans-serif;padding:0 8px;border-radius:10px;background:#FBE3E0;color:#A12A1E}
.bd-own{font-weight:700;color:#333}
.bd-flag{font:800 12px/1.6 system-ui,sans-serif;padding:0 8px;border-radius:10px;background:#B2472F;color:#fff}
.bd-note{font-size:12.5px;color:#666;margin-top:4px;overflow-wrap:anywhere}
.bd-empty{color:#888;font-size:13px;padding:6px 4px}
.bd-wait{font:700 12px/1.6 system-ui,sans-serif;padding:0 8px;border-radius:10px;background:#F6E7B8;color:#6B4E00}
/* 기다림 종류 태그 — 무엇을 기다리는지 색으로 한눈에 (spider-universe#368) */
.bd-kinds{margin:0 0 8px}
.bd-wait.k-review{background:#DCE8FA;color:#1D4C8F}.bd-wait.k-pr{background:#E6DDF7;color:#4B2C8A}.bd-wait.k-issue{background:#FBE0D3;color:#8E3320}
.bd-wait.k-date{background:#E2F0E3;color:#22603A}.bd-wait.k-system{background:#E7E5E0;color:#4A4741}.bd-wait.k-unknown{background:#C0392B;color:#fff}
.bd-std{font:800 11.5px/1.6 system-ui,sans-serif;padding:0 7px;border-radius:4px;background:#E4DCF2;color:#4A3878}
.bd-standing{grid-column:1/-1;margin-top:4px}
.bd-standing .bd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.bd-standing .bd-cw{margin:0}
/* 진행판 질문 '＋ 더 묻기' (spider-universe#358) — 카드(<a>) 밖, 카드 바로 밑. 글·답 칸은 sheet.css 의 문항 질문(v-askq-*) 모양을 그대로 쓴다 */
.bd-ask{padding:4px 2px 0}
.bd-ask-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bd-ask-b{min-height:36px;padding:0 12px;border:1px dashed #CFCBC2;border-radius:8px;background:transparent;font:600 13px system-ui,sans-serif;color:#6B675E;cursor:pointer}
.bd-ask-b[aria-expanded="true"]{border-style:solid;border-color:#C96442;color:#C96442}
.bd-ask-wait{font:700 12px/1.6 system-ui,sans-serif;padding:0 8px;border-radius:10px;background:#FBE3D6;color:#8E3320}
.bd-ask-msg{font-size:12.5px;color:#6B675E}
.bd-ask-ed{margin-top:6px}
.bd-ask-ed .v-att{display:flex;gap:8px;align-items:center;margin-top:6px}
.bd-ask-go{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:#1F6B3A;color:#fff;font:700 14px system-ui,sans-serif;cursor:pointer}.bd-ask-go:disabled{opacity:.6}
.bd-cw.asking .bd-card{box-shadow:0 0 0 2px #E7A98F}
/* 「더 묻기」 끔(기본) — 폰에서 카드마다 버튼 줄이 붙어 정신없던 것 (spider-universe#358 hero 10-30). 끄면 질문 있는 카드만 대화·표시가 남는다 */
.bd-ask.off .bd-ask-b,.bd-ask.off .bd-ask-ed{display:none}.bd-ask.off:not(.has){display:none}
.rs-page .bd-ask .v-askq-log{margin-top:6px}
.rs-page .bd-ask .v-askq-item{font-size:13.5px;overflow-wrap:anywhere}
.bd-more{width:100%;min-height:36px;border:1px dashed #CFCBC2;border-radius:8px;background:transparent;font:700 13px system-ui,sans-serif;color:#555;cursor:pointer}
@media (max-width:1100px){.bd-cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.bd-cols{grid-template-columns:1fr}.bd-col.doing{order:-1}}
</style>
<body class="rs-page"><main>
<div class="eyebrow"><a href="/">REVIEW-SHEET</a> · 진행판</div><h1 id="bd-title">진행판</h1>
<p class="lede">보기 전용 — 일은 이슈에서 바뀐다. <span id="bd-upd"></span> <span id="bd-links"></span></p>
<div id="bd-stale" class="bd-stale" hidden></div>
<div class="bd-top" id="bd-groups"></div>
<div class="bd-top" id="bd-modes"></div>
<div class="bd-top" id="bd-opts"></div>
<div class="bd-cols" id="bd-cols"></div>
</main>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}); };
const COLS = [['todo', '할 일'], ['doing', '하는 중'], ['wait', '기다림'], ['ship', '배포 대기'], ['done', '끝']];
const MODE = { claude: '클로드 직접 작업', system: '시스템 대기', idle: '창 입력 대기 · 외부 기다림 없음' };
const RANK = { p0: 0, p1: 1, p2: 2, p3: 3, '긴급': 0, '높음': 1, '중간': 2, '낮음': 3 };
const rank = p => { const k = String(p || '').toLowerCase(); return k in RANK ? RANK[k] : 9; };
const pcls = p => { const r = rank(p); return r <= 2 ? ' p' + r : ''; };
const ui = { group: '', mode: '', askOn: false, more: {}, ask: {} };   // ask: { <카드>: { open, draft, msg, msgAt } } — 5초 다시 그림에도 쓰던 글이 남게
try { Object.assign(ui, JSON.parse(localStorage.getItem('bd-ui') || '{}'), { more: {}, ask: {} }); } catch {}
const save = () => { try { localStorage.setItem('bd-ui', JSON.stringify({ group: ui.group, mode: ui.mode, askOn: ui.askOn })); } catch {} };
let last = null, asks = {};

// 상시(늘 도는 것, spider #247) — 진행판이 standing 을 달거나 노트 머리 「상시 · 」. 기다림 칸·셈에서 빼고 맨 아래 묶음으로
const STD = '상시 · ';
const standing = c => c.standing === true || String(c.note || '').startsWith(STD);
const parked = c => standing(c) && c.status === 'wait';
// 기다림 종류 (spider-universe#368) — 생산자가 waitKind 를 주면 색·앞말을 바꾼다. 없으면 옛 모양 그대로
const WK = { review: '리뷰', pr: 'PR 검사', issue: '다른 이슈', date: '날짜', system: '시스템', unknown: '미분류' };
const waitTag = c => {
  const k = WK[c.waitKind] ? c.waitKind : '';
  if (!k) return c.waitfor ? '<span class="bd-wait">기다림 · ' + esc(c.waitfor) + '</span>' : '';
  const d = c.waitfor || c.waitRef || '';
  return '<span class="bd-wait k-' + k + '">' + WK[k] + (d ? ' · ' + esc(d.replace(/^(시트|이슈|날짜)\s+/, '')) : '') + '</span>';
};
// 기다림 노트의 기계 줄(wait: x=… owner=… until=…)은 태그가 대신한다 — 「 — 」 뒤 사람 말만
const noteText = c => { const n = String(c.note || ''); if (!c.waitKind || !/wait\s*:/.test(n)) return n; const i = n.indexOf(' — '); return i < 0 ? '' : n.slice(i + 3); };
const cardA = c => '<a class="bd-card' + pcls(c.priority) + '"' + (c.url ? ' href="' + esc(c.url) + '" target="_blank" rel="noopener"' : '') + '>' +
  '<b>' + esc(c.title) + '</b><div class="bd-meta">' +
  (standing(c) ? '<span class="bd-std">상시</span>' : '') +
  (c.priority ? '<span class="bd-pri">' + esc(c.priority) + '</span>' : '') +
  (c.flag ? '<span class="bd-flag">' + esc(c.flag) + '</span>' : '') +
  waitTag(c) +
  (c.stall && c.status === 'doing' ? '<span class="bd-stall">' + esc(c.stall) + '</span>' : '') +
  (c.mode ? '<span class="bd-mode ' + c.mode + '">' + MODE[c.mode] + (c.modeNote ? ' · ' + esc(c.modeNote) : '') + '</span>' : '') +
  (c.owner && c.owner.length ? '<span class="bd-own">' + c.owner.map(esc).join(', ') + '</span>' : (c.status === 'todo' ? '' : '<span>담당 없음</span>')) +
  (c.id ? '<span>' + esc(c.id) + '</span>' : '') + (c.at ? '<span>' + when(c.at) + '</span>' : '') +
  '</div>' + (noteText(c) ? '<div class="bd-note">' + esc(noteText(c).startsWith(STD) ? noteText(c).slice(STD.length) : noteText(c)) + '</div>' : '') + '</a>';
// 카드 = <a> + 그 밖의 '＋ 더 묻기' 칸 (버튼·글칸이 링크 안에 있으면 누를 때 이슈가 열린다)
const CARD_RE = /^[a-z0-9-]{1,60}#\d{1,9}$/;
const card = c => {
  if (!c.id || !CARD_RE.test(c.id)) return '<div class="bd-cw">' + cardA(c) + '</div>';
  const st = ui.ask[c.id] || {}, list = asks[c.id] || [], waiting = list.some(a => !a.replies.length);
  return '<div class="bd-cw' + (waiting ? ' asking' : '') + '" data-card="' + esc(c.id) + '">' + cardA(c) + '<div class="bd-ask' + (ui.askOn || st.open ? '' : ' off') + (list.length ? ' has' : '') + '">' +
    '<div class="bd-thread">' + thread(list) + '</div>' +
    '<div class="bd-ask-row"><button type="button" class="bd-ask-b" aria-expanded="' + !!st.open + '">＋ 더 묻기</button>' +
    '<span class="bd-ask-mark">' + mark(list) + '</span><span class="bd-ask-msg">' + esc(st.msg && Date.now() - st.msgAt < 15000 ? st.msg : '') + '</span></div>' +
    '<div class="bd-ask-ed"' + (st.open ? '' : ' hidden') + '><textarea class="v-askq-t" rows="2" maxlength="2000" placeholder="이 카드 일에 대해 담당 창에 묻기">' + esc(st.draft || '') + '</textarea>' +
    '<div class="v-att"><button type="button" class="bd-ask-go">보내기</button></div></div></div></div>';
};
const asksEsc = t => esc(t).replace(/\n/g, '<br>');
const mark = list => list.some(a => !a.replies.length) ? '<span class="bd-ask-wait">❓ 답 기다림</span>' : '';
const thread = list => !list.length ? '' : '<div class="v-askq-log">' + (list.length > 3 ? '<div class="bd-note">이전 질문 ' + (list.length - 3) + '개</div>' : '') +
  list.slice(-3).map(a => '<div class="v-askq-item"><div class="me"><b>❓ 질문</b> <span class="t">' + when(a.ts) + '</span><div>' + asksEsc(a.text) + '</div></div>' +
    (a.replies.length ? a.replies.map(r => '<div class="re"><b>💬 ' + esc(r.from) + '</b> <span class="t">' + when(r.ts) + '</span><div>' + asksEsc(r.text) + '</div></div>').join('')
      : '<div class="re wait">답 기다리는 중 — 담당 창에 전달됨</div>') + '</div>').join('') + '</div>';

const chips = (el, key, items, all) => {
  el.innerHTML = items.length < 2 ? '' : [['', all]].concat(items).map(([v, label]) =>
    '<button type="button" class="bd-chip' + (ui[key] === v ? ' on' : '') + '" data-k="' + key + '" data-v="' + esc(v) + '">' + esc(label) + '</button>').join('');
};

function render(b) {
  const cols = document.getElementById('bd-cols'), stale = document.getElementById('bd-stale');
  if (!b) { cols.innerHTML = '<p class="bd-empty">아직 진행판이 없다 — 생산자가 <code>review-sheet board</code> 로 board.json 을 써야 한다.</p>'; return; }
  document.getElementById('bd-title').textContent = b.title || '진행판';
  document.getElementById('bd-links').innerHTML = (b.links || []).map(l => `<a class="rs-boardlink" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join(' ');
  document.getElementById('bd-upd').textContent = '갱신 ' + when(b.updatedAt) + (b.source ? ' · ' + b.source : '');
  const age = (Date.now() - new Date(b.updatedAt)) / 60000;
  stale.hidden = !(age > 10);
  if (age > 10) stale.textContent = Math.round(age) + '분째 갱신 없음 — 생산자가 멈췄을 수 있다. 아래는 그때 상태다.';
  const groups = [...new Set(b.cards.map(c => c.group).filter(Boolean))].sort();
  if (ui.group && !groups.includes(ui.group)) ui.group = '';
  chips(document.getElementById('bd-groups'), 'group', groups.map(g => [g, g + ' ' + b.cards.filter(c => c.group === g && c.status !== 'done' && !parked(c)).length]), '전체');
  const doing = b.cards.filter(c => c.status === 'doing' && (!ui.group || c.group === ui.group));
  const modes = Object.keys(MODE).filter(m => doing.some(c => c.mode === m));
  if (ui.mode && !modes.includes(ui.mode)) ui.mode = '';
  document.getElementById('bd-opts').innerHTML = '<button type="button" class="bd-chip bd-asktog' + (ui.askOn ? ' on' : '') + '" aria-pressed="' + ui.askOn + '">＋ 더 묻기 ' + (ui.askOn ? '켜짐' : '꺼짐') + '</button>';
  chips(document.getElementById('bd-modes'), 'mode', modes.map(m => [m, MODE[m] + ' ' + doing.filter(c => c.mode === m).length]), '하는 중 전부 ' + doing.length);
  const pick = st => b.cards.filter(c => c.status === st && !parked(c) && (!ui.group || c.group === ui.group) && (st !== 'doing' || !ui.mode || c.mode === ui.mode))
    .sort((x, y) => st === 'done' ? String(y.at || '').localeCompare(String(x.at || '')) : rank(x.priority) - rank(y.priority) || String(y.at || '').localeCompare(String(x.at || '')));
  cols.innerHTML = COLS.map(([st, label]) => {
    const list = pick(st), shown = st !== 'doing' && !ui.more[st] ? list.slice(0, 12) : list;
    const sp = st === 'wait' && !ui.group ? split(list) : '';
    return '<section class="bd-col ' + st + '"><h2>' + label + '<small>' + list.length + (sp ? ' <span class="bd-split">(' + esc(sp) + ')</span>' : '') + '</small></h2>' +
      (st === 'wait' ? kinds(list) : '') +
      (shown.length ? shown.map(card).join('') : '<p class="bd-empty">없음</p>') +
      (shown.length < list.length ? '<button type="button" class="bd-more" data-st="' + st + '">' + label + ' ' + (list.length - shown.length) + '개 더 보기</button>' : '') + '</section>';
  }).join('') + standingGroup(b);
}
// 기다림 칸 머리 밑에 종류별 수 — 리뷰 3 · PR 검사 1 · 날짜 5 (spider-universe#368)
const kinds = list => {
  const n = {}; for (const c of list) if (WK[c.waitKind]) n[c.waitKind] = (n[c.waitKind] || 0) + 1;
  const ks = Object.keys(WK).filter(k => n[k]);
  return ks.length ? '<div class="bd-meta bd-kinds">' + ks.map(k => '<span class="bd-wait k-' + k + '">' + WK[k] + ' ' + n[k] + '</span>').join('') + '</div>' : '';
};
// 기다림 칸 머리 수를 레포별로 — 「전체」 에서 pkch·spider 기다림이 한 수로 섞여 보이던 것 (spider-universe#359, pkch#3619)
const split = list => {
  const n = {};
  for (const c of list) n[c.group || '기타'] = (n[c.group || '기타'] || 0) + 1;
  const gs = Object.keys(n).sort();
  return gs.length < 2 ? '' : gs.map(g => g + ' ' + n[g]).join(' · ');
};
const standingGroup = b => {
  const list = b.cards.filter(c => parked(c) && (!ui.group || c.group === ui.group)).sort((x, y) => rank(x.priority) - rank(y.priority));
  return list.length ? '<section class="bd-col bd-standing"><h2>상시(늘 도는 것)<small>' + list.length + '</small></h2><div class="bd-list">' + list.map(card).join('') + '</div></section>' : '';
};

document.addEventListener('click', e => {
  const t = e.target.closest('.bd-chip, .bd-more'); if (!t) return;
  if (t.classList.contains('bd-asktog')) { ui.askOn = !ui.askOn; save(); render(last); return; }
  if (t.dataset.st) ui.more[t.dataset.st] = true; else { ui[t.dataset.k] = t.dataset.v; save(); }
  render(last);
});
// 글칸이 열려 있으면 판을 다시 그리지 않는다(쓰던 글·커서·한글 조합이 날아감) — 답 줄·표시만 그 자리에서 바꾼다
const editing = () => Object.entries(ui.ask).some(([id, x]) => x.open && document.querySelector('.bd-cw[data-card="' + CSS.escape(id) + '"]'));
function paintAsks() {
  for (const w of document.querySelectorAll('.bd-cw[data-card]')) {
    const list = asks[w.dataset.card] || [], th = thread(list), mk = mark(list);
    const t = w.querySelector('.bd-thread'); if (t.innerHTML !== th) t.innerHTML = th;
    const m = w.querySelector('.bd-ask-mark'); if (m.innerHTML !== mk) m.innerHTML = mk;
    w.classList.toggle('asking', list.some(a => !a.replies.length));
    const a = w.querySelector('.bd-ask'); if (a) a.classList.toggle('has', list.length > 0);
  }
}
async function load() {
  try {
    const [rb, ra] = await Promise.all([fetch('/api/board', { cache: 'no-store' }), fetch('/api/board-asks', { cache: 'no-store' }).catch(() => null)]);
    last = (await rb.json()).board;
    if (ra && ra.ok) asks = await ra.json();
    if (editing()) paintAsks(); else render(last);
  }
  catch { document.getElementById('bd-upd').textContent = '서버 연결 안 됨 — 다시 시도 중'; }
}
const askState = id => ui.ask[id] || (ui.ask[id] = { open: false, draft: '', msg: '', msgAt: 0 });
document.addEventListener('click', async e => {
  const b = e.target.closest('.bd-ask-b, .bd-ask-go'); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const w = b.closest('.bd-cw'), id = w.dataset.card, st = askState(id), ed = w.querySelector('.bd-ask-ed'), ta = ed.querySelector('textarea'), btn = w.querySelector('.bd-ask-b'), msg = w.querySelector('.bd-ask-msg');
  if (b === btn) {
    st.open = ed.hidden; ed.hidden = !st.open; btn.setAttribute('aria-expanded', String(st.open));
    if (st.open) { ta.value = st.draft; ta.focus(); } else render(last);
    return;
  }
  const text = ta.value.trim(); if (!text) { ta.focus(); return; }
  b.disabled = true; msg.textContent = '보내는 중…';
  try {
    const r = await fetch('/__board-ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ card: id, text }) });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    Object.assign(st, { open: false, draft: '', msg: j.via === 'chat' && j.ch ? '보냄 — 담당 채널 ' + j.ch + ' 에 전달' : '보냄 — 담당 창에 전달', msgAt: Date.now() });
    load();
  } catch (err) { b.disabled = false; msg.textContent = '못 보냄: ' + String(err.message || err).slice(0, 120); }
});
document.addEventListener('input', e => {
  const ta = e.target.closest && e.target.closest('.bd-ask-ed textarea'); if (!ta) return;
  askState(ta.closest('.bd-cw').dataset.card).draft = ta.value;
});
load(); setInterval(() => { if (!document.hidden) load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
