<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="리뷰시트"><script src="/push.js" defer></script>
<title>채널</title>
<link rel="stylesheet" href="/sheet.css">
<script src="/keys.js" defer></script>
<script src="/mic.js" defer></script>
<script src="/compose.js" defer></script>
<!-- review-sheet 상시 채널: hero ↔ 한 세션의 메신저. GET /api/chat?c=<ch>, POST /__chat?c=<ch> {text, files, re?, kind?} (항상 hero 로 기록).
     kind(hero 2026-10-18) = issue|bug|followup — ＋ 줄의 '고급'을 켜면 입력칸 위 칩으로 고른다(하나만, 다시 누르면 해제). 말풍선에 배지, 세션 쪽엔 [태그] + 할 일 한 줄.
     답장(re = 원문 메시지 id, 카톡식): 말풍선 위에 원문 인용이 뜨고 누르면 원문으로 이동. 세션은 `chat say <ch> --re <id> …`, 페이지는 말풍선의 ↩.
     이미지: 📎·붙여넣기·끌어놓기 → POST /__chat/file?c=<ch> (raw body) → {name} → 메시지 files 에 실어 보냄.
     세션 쪽은 `review-sheet chat wait <ch>` 로 받고 `chat say <ch> <text>` 로 답한다. meta.seenAt 이 "세션이 여기까지 읽음". -->
</head>
<body class="rs-page rs-chat">
<main id="app">
  <div class="eyebrow"><a href="/" class="rs-back">← 받은편지함</a> <button type="button" class="rs-refresh" id="rs-refresh">↻ 새로고침</button> <span id="c-upd"></span></div>
  <h1 id="c-title">…</h1><span id="rs-push"></span>
  <p class="lede" id="c-lede"></p>
  <div class="c-pin" id="c-pin" hidden></div>
  <div class="c-log" id="c-log"></div>
  <form class="c-bar" id="c-form">
    <div class="c-att" id="c-att" hidden></div>
    <div class="c-reply" id="c-reply" hidden><b>↩</b><span id="c-reply-t"></span><button type="button" id="c-reply-x" aria-label="답장 취소">✕</button></div>
    <!-- ＋ 묶음(hero 2026-10-09): 사진·음성·편지함은 입력칸 옆에 늘어놓지 않고 ＋ 로 여는 줄에 — 입력칸이 한 줄을 다 쓴다. 열림 상태는 기기에 기억 -->
    <div class="c-tray" id="c-tray" hidden>
      <label class="c-clip" title="이미지 첨부 (붙여넣기·끌어놓기도 됨)">📎 사진<input type="file" id="c-file" accept="image/*" multiple hidden></label>
      <button type="button" class="rs-mic" data-for="c-in" data-idle="🎤 음성" aria-label="음성 입력">🎤 음성</button>
      <a class="c-inbox" href="/" title="받은편지함으로">📥 편지함</a>
      <button type="button" class="c-adv" id="c-adv" aria-pressed="false" title="메시지 종류 칩 보이기">🏷 고급</button>
    </div>
    <div class="c-kinds" id="c-kinds" role="group" aria-label="메시지 종류" hidden>
      <button type="button" class="c-kind-chip" data-kind="issue" aria-pressed="false">이슈 제기</button>
      <button type="button" class="c-kind-chip" data-kind="bug" aria-pressed="false">버그 제보</button>
      <button type="button" class="c-kind-chip" data-kind="followup" aria-pressed="false">지난 이슈 확인</button>
    </div>
    <button type="button" class="rs-plus" data-tray="c-tray" aria-expanded="false" aria-label="사진·음성·편지함">＋</button>
    <div class="c-field"><textarea id="c-in" rows="1" placeholder="메시지 (Enter = 보내기, Shift+Enter = 줄바꿈)"></textarea><button type="button" class="rs-clear" title="모두 지우기" aria-label="입력 모두 지우기">✕</button></div>
    <button type="submit" class="save" id="c-send">보내기</button>
  </form>
</main>
<script>
const CH = new URLSearchParams(location.search).get('c') || '';
const e = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t = iso => new Date(iso).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
const KINDS = { issue: '이슈 제기', bug: '버그 제보', followup: '지난 이슈 확인' };
const linkify = s => e(s).replace(/(https?:\/\/[^\s<]+)/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>').replace(/\n/g, '<br>');
let meta = null, lastKey = '', first = true;
const STEP = 50; let shown = STEP, total = 0, refs = {};   // 최근 shown 개만 받는다. 위의 '이전 대화 더 보기' 로 STEP 씩 늘림
const log = document.getElementById('c-log'), upd = document.getElementById('c-upd');
// 로그가 자체 스크롤이면 로그를, 아니면(페이지가 늘어나는 레이아웃) 창을 맨 아래로
const pageEl = document.scrollingElement || document.documentElement;
const nearBottom = () => (log.scrollHeight - log.scrollTop - log.clientHeight < 40) && (pageEl.scrollHeight - pageEl.scrollTop - window.innerHeight < 80);
const toBottom = () => { log.scrollTop = log.scrollHeight; window.scrollTo(0, pageEl.scrollHeight); };
const render = (m, msgs) => {
  meta = m;
  document.title = m.title; document.getElementById('c-title').textContent = m.title;
  document.getElementById('c-lede').textContent = m.owner + ' 와 직접 대화 · 세션은 "chat wait" 로 받고 답한다';
  const pin = document.getElementById('c-pin'), pt = m.pin && m.pin.text ? '📌 ' + m.pin.text : '';   // 고정 글(chat pin) — 메시지 키와 별개로 매번 맞춘다
  if (pin.dataset.t !== pt) { pin.dataset.t = pt; pin.innerHTML = pt ? linkify(pt) : ''; pin.hidden = !pt; }
  const key = msgs.length + ':' + (msgs.length ? msgs[0].id + ':' + msgs[msgs.length - 1].id : '') + ':' + (m.seenAt || '');
  if (key === lastKey) return; lastKey = key;
  const atBottom = nearBottom();
  const byId = { ...refs }; for (const x of msgs) byId[x.id] = x; window.__msgs = byId;
  const keep = more ? document.querySelector('#c-log .c-msg') : null, keepTop = keep ? keep.getBoundingClientRect().top : 0;
  // 답장(x.re): 말풍선 맨 위에 원문 한 줄 인용 — 누르면 원문으로 이동(아래 click). 원문이 지워졌으면 글만
  const quote = x => { if (!x.re) return ''; const q = byId[x.re]; const who = !q ? '' : q.from === 'hero' ? '나' : q.from;
    const txt = !q ? '(원문 없음)' : (q.text || '').replace(/\s+/g, ' ').trim() || ((q.files || []).length ? '📷 사진' : '');
    return '<a class="c-quote" href="#m-' + e(x.re) + '" data-to="' + e(x.re) + '"><span class="c-qwho">↩ ' + (who ? e(who) + ' 에게 답장' : '답장') + '</span><span class="c-qtxt">' + e(txt) + '</span></a>'; };
  let h = total > msgs.length ? '<button type="button" class="rs-refresh c-more" id="c-more">이전 대화 더 보기 (' + (total - msgs.length) + ')</button>' : '', day = '';
  for (const x of msgs) {
    const d = new Date(x.ts).toLocaleDateString('ko-KR'); if (d !== day) { day = d; h += '<div class="c-day">' + e(d) + '</div>'; }
    const mine = x.from === 'hero';
    h += '<div class="c-msg ' + (mine ? 'me' : 'them') + '" id="m-' + e(x.id) + '">' + (mine ? '' : '<div class="c-who">' + e(x.from) + '</div>') +
      '<div class="c-bubble">' + (KINDS[x.kind] ? '<span class="c-kind c-kind-' + x.kind + '">' + KINDS[x.kind] + '</span>' : '') + quote(x) + (x.files || []).map(f => { const u = '/chat/' + encodeURIComponent(CH) + '.files/' + encodeURIComponent(f); return '<a href="' + u + '" target="_blank" rel="noopener"><img class="c-img" src="' + u + '" alt="" loading="lazy"></a>'; }).join('') + linkify(x.text) + '</div><div class="c-meta">' + t(x.ts) + (mine && m.seenAt && x.ts <= m.seenAt ? ' · 읽음' : '') + ' <button type="button" class="c-re" data-re="' + e(x.id) + '" title="이 메시지에 답장" aria-label="답장">↩</button></div></div>';
  }
  log.innerHTML = h || '<div class="c-day">아직 대화 없음 — 아래에 적어 보내면 세션이 받는다</div>';
  if (keep) { more = false; const k = document.getElementById(keep.id); if (k) { const dy = k.getBoundingClientRect().top - keepTop; log.scrollTop += dy; window.scrollBy(0, dy); } return; }   // 더 보기: 보던 자리 유지
  if (atBottom || first) { first = false; toBottom(); requestAnimationFrame(toBottom); }
};
const load = async (seen) => {
  try {
    if (seen) await fetch('/__chat?c=' + encodeURIComponent(CH), { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });
    const r = await fetch('/api/chat?c=' + encodeURIComponent(CH) + '&limit=' + shown, { cache: 'no-store' });
    if (!r.ok) { log.innerHTML = '<div class="c-day">채널 없음: ' + e(CH) + '</div>'; return; }
    const j = await r.json(); total = j.total || j.messages.length; refs = j.refs || {}; render(j.meta, j.messages);
    upd.textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR');
  } catch (_) { upd.textContent = '갱신 실패 — 서버 확인'; }
};
const input = document.getElementById('c-in'), sendBtn = document.getElementById('c-send'), att = document.getElementById('c-att');
if (matchMedia('(pointer: coarse)').matches) input.placeholder = '메시지';   // 폰: 긴 안내문이 두 줄로 접혀 칸이 커지지 않게
// 첨부 대기열: 고른 이미지는 보내기 전까지 미리보기로만 들고 있다. 큰 사진은 긴 변 2048px JPEG 로 줄여 올린다
let pending = [];
const shrink = f => new Promise(res => {
  if (f.size < 1.5e6 || !/^image\/(png|jpeg|webp)$/.test(f.type)) return res(f);
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => { const k = Math.min(1, 2048 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => res(b && b.size < f.size ? b : f), 'image/jpeg', 0.88); };
  img.onerror = () => { URL.revokeObjectURL(u); res(f); }; img.src = u;
});
const drawAtt = () => {
  att.hidden = !pending.length;
  att.innerHTML = pending.map((p, i) => '<span class="c-thumb"><img src="' + p.url + '" alt=""><button type="button" data-i="' + i + '" aria-label="빼기">✕</button></span>').join('');
};
const addFiles = list => { for (const f of list) if (f && /^image\//.test(f.type)) pending.push({ file: f, url: URL.createObjectURL(f) }); drawAtt(); };
att.addEventListener('click', ev => { const b = ev.target.closest('button[data-i]'); if (!b) return; const [p] = pending.splice(+b.dataset.i, 1); URL.revokeObjectURL(p.url); drawAtt(); });
document.getElementById('c-file').addEventListener('change', ev => { addFiles(ev.target.files); ev.target.value = ''; });
document.addEventListener('paste', ev => { const fs = [...(ev.clipboardData ? ev.clipboardData.files : [])].filter(f => /^image\//.test(f.type)); if (fs.length) { ev.preventDefault(); addFiles(fs); } });
document.addEventListener('dragover', ev => { if ([...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
document.addEventListener('drop', ev => { if (ev.dataTransfer.files.length) { ev.preventDefault(); addFiles(ev.dataTransfer.files); } });
// 답장: 인용 누르면 원문으로 스크롤 + 잠깐 테두리. 말풍선의 ↩ 누르면 입력칸 위에 "누구에게 답장" 띠 → 보내면 re 로 실림(강제 아님, ✕ 로 뺌)
let replyTo = null;
const replyBar = document.getElementById('c-reply'), replyTxt = document.getElementById('c-reply-t');
const setReply = x => { replyTo = x; replyBar.hidden = !x; if (x) { replyTxt.textContent = (x.from === 'hero' ? '나' : x.from) + ' 에게 답장 · ' + ((x.text || '').replace(/\s+/g, ' ').trim() || '📷 사진'); input.focus(); } };
document.getElementById('c-reply-x').addEventListener('click', () => setReply(null));
let more = false;
log.addEventListener('click', ev => {
  if (ev.target.id === 'c-more') { ev.target.disabled = true; shown += STEP; more = true; load(false); return; }
  const q = ev.target.closest('.c-quote');
  if (q) { ev.preventDefault(); let el = document.getElementById('m-' + q.dataset.to);
    if (!el && shown < total) { shown = total; lastKey = ''; return load(false).then(() => { const x = document.getElementById('m-' + q.dataset.to); if (x) { x.scrollIntoView({ block: 'center' }); x.classList.add('flash'); setTimeout(() => x.classList.remove('flash'), 1600); } }); }   // 원문이 아직 안 불러온 범위면 전부 받아서 이동
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); return; }
  const b = ev.target.closest('.c-re');
  if (b) { const r = (window.__msgs || {})[b.dataset.re]; if (r) setReply(r); }
});
// 메시지 종류(hero 2026-10-18): '고급' 켜짐은 이 기기에 기억(기본 꺼짐). 칩은 하나만 — 다시 누르면 해제, 안 고르면 평문. 보내면 풀린다
let kind = null;
const advBtn = document.getElementById('c-adv'), kindsBar = document.getElementById('c-kinds');
const setKind = k => { kind = k; kindsBar.querySelectorAll('.c-kind-chip').forEach(b => { const on = b.dataset.kind === k; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); };
const setAdv = on => { kindsBar.hidden = !on; advBtn.classList.toggle('on', on); advBtn.setAttribute('aria-pressed', String(on)); if (!on) setKind(null);
  try { localStorage.setItem('rs-chat-adv', on ? '1' : '0'); } catch (_) { /* private mode */ } };
try { setAdv(localStorage.getItem('rs-chat-adv') === '1'); } catch (_) { setAdv(false); }
advBtn.addEventListener('click', () => setAdv(kindsBar.hidden));
kindsBar.addEventListener('mousedown', ev => { if (ev.target.closest('.c-kind-chip')) ev.preventDefault(); });   // 칩을 눌러도 입력칸 포커스(폰 키보드) 유지
kindsBar.addEventListener('click', ev => { const b = ev.target.closest('.c-kind-chip'); if (b) setKind(kind === b.dataset.kind ? null : b.dataset.kind); });
/* one send at a time: Korean IME on iOS fires compositionend (→ deferred submit) and then one more plain Enter keydown,
   so submit() can run twice before the first fetch clears the input — the second would post the same text again. */
let sending = false;
const submit = async () => {
  if (sending) return;
  const mic = window.RSMic && window.RSMic.finish(input);   // 녹음 중 Enter = 녹음 끝내고 최종 전사로 보낸다
  if (mic) { sending = true; sendBtn.disabled = true; try { await mic; } finally { sending = false; sendBtn.disabled = false; } }
  const text = input.value.trim(); if (!text && !pending.length) return;
  sending = true; sendBtn.disabled = true;
  try {
    const files = [];
    for (const p of pending) {
      upd.textContent = '이미지 올리는 중 ' + (files.length + 1) + '/' + pending.length + '…';
      const b = await shrink(p.file);
      const r = await fetch('/__chat/file?c=' + encodeURIComponent(CH), { method: 'POST', headers: { 'content-type': b.type || 'application/octet-stream' }, body: b });
      if (!r.ok) throw new Error('이미지 ' + (await r.text()));
      files.push((await r.json()).name);
    }
    const r = await fetch('/__chat?c=' + encodeURIComponent(CH), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, files, re: replyTo ? replyTo.id : undefined, kind: kind || undefined }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    for (const p of pending) URL.revokeObjectURL(p.url); pending = []; drawAtt(); setReply(null); setKind(null);
    input.value = ''; fit(); setTimeout(() => { if (/^\s*$/.test(input.value)) { input.value = ''; fit(); } }, 0); await load(false); toBottom();
  } catch (err) { upd.textContent = '✗ 전송 실패(' + err.message + ')'; }
  finally { sending = false; sendBtn.disabled = false; input.focus(); }
};
document.getElementById('c-form').addEventListener('submit', ev => { ev.preventDefault(); submit(); });
// 한글 IME: 조합 중 Enter 는 줄바꿈을 넣지 않고(preventDefault) 조합이 끝난 뒤 보낸다 — 커서가 아랫줄로 내려가던 버그
let composing = false, sendAfterCompose = false;
input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend', () => { composing = false; if (sendAfterCompose) { sendAfterCompose = false; setTimeout(submit, 0); } });
input.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.shiftKey) return;
  ev.preventDefault();
  if (ev.isComposing || composing || ev.keyCode === 229) { sendAfterCompose = true; return; }
  submit();
});
// 높이 맞춤: border-box 라 scrollHeight 에 테두리를 더해야 한 줄이 칸 안에 딱 맞는다(안 더하면 1~2px 넘쳐 내용이 위로 밀리고 커서가 글자 밑에 보임)
function fit() { input.style.height = ''; if (!input.value) return; input.style.height = Math.min(input.scrollHeight + input.offsetHeight - input.clientHeight, 160) + 'px'; }
input.addEventListener('input', fit);
document.getElementById('rs-refresh').addEventListener('click', () => load(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
load(true); setInterval(() => load(false), 3000);
</script>
</body>
</html>
