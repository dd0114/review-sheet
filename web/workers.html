<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일꾼 — review-sheet</title><link rel="stylesheet" href="/sheet.css"><link rel="stylesheet" href="/workers.css">
<body class="rs-page wb-full"><main><div class="eyebrow"><a href="/" class="rs-back">← 받은편지함</a> · 갱신 5초 · <span id="wb-upd"></span></div><h1 id="wb-t">일꾼</h1>
<div class="wb-panel"><div id="wb-board"></div></div></main>
<script src="/workers.js"></script><script>
const WB = window.WorkerBoard, board = document.getElementById('wb-board');
const tick = async () => {
  try {
    const b = await WB.fetchBoard();
    WB.render(board, b);
    document.getElementById('wb-t').textContent = '🏗 ' + WB.summary(b);
    document.title = WB.summary(b) + ' — review-sheet';
    document.getElementById('wb-upd').textContent = '갱신 ' + new Date().toLocaleTimeString('ko-KR') + (b.error ? ' · 공급 오류: ' + b.error : '');
  } catch (_) { document.getElementById('wb-upd').textContent = '갱신 실패 — 서버 확인'; }
};
WB.loadSprites('/sprites/').then(tick);
setInterval(tick, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script></body></html>
